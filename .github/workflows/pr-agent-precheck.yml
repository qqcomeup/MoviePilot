name: PR-Agent Precheck

"on":
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Pull request URL to review"
        required: true
        type: string
      command:
        description: "PR-Agent command"
        required: true
        type: choice
        default: improve
        options:
          - improve
          - review
          - describe
      model:
        description: "LiteLLM model name; leave empty to use repository variable PR_AGENT_MODEL"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent-precheck:
    name: Run PR-Agent precheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PR-Agent CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pr-agent==0.39.0"

      - name: Run PR-Agent
        env:
          PR_URL: ${{ inputs.pr_url }}
          PR_AGENT_COMMAND: ${{ inputs.command }}
          PR_AGENT_MODEL_INPUT: ${{ inputs.model }}
          PR_AGENT_MODEL_VARIABLE: ${{ vars.PR_AGENT_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_AGENT_GITHUB_TOKEN: ${{ secrets.PR_AGENT_GITHUB_TOKEN }}
          OPENAI_KEY_SECRET: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_KEY_SECRET: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE_SECRET: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_BASE_URL_SECRET: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail

          export GITHUB__USER_TOKEN="${PR_AGENT_GITHUB_TOKEN:-$GITHUB_TOKEN}"
          export OPENAI__KEY="${OPENAI_KEY_SECRET:-$OPENAI_API_KEY_SECRET}"
          export OPENAI__API_BASE="${OPENAI_API_BASE_SECRET:-$OPENAI_BASE_URL_SECRET}"
          export CONFIG__MODEL="${PR_AGENT_MODEL_INPUT:-${PR_AGENT_MODEL_VARIABLE:-openai/claude-fable-5}}"
          export CONFIG__FALLBACK_MODELS="[]"
          export CONFIG__CUSTOM_MODEL_MAX_TOKENS="32000"
          export CONFIG__RESPONSE_LANGUAGE="zh-CN"
          export CONFIG__AI_TIMEOUT="240"
          export CONFIG__LARGE_PATCH_POLICY="clip"
          export CONFIG__IGNORE_PR_TITLE='["^\\[Auto\\]", "^Auto"]'
          export CONFIG__IGNORE_PR_LABELS='["skip pr-agent"]'
          export PR_DESCRIPTION__GENERATE_AI_TITLE="false"
          export PR_DESCRIPTION__PUBLISH_LABELS="false"
          export PR_DESCRIPTION__ENABLE_PR_DIAGRAM="false"
          export PR_DESCRIPTION__COLLAPSIBLE_FILE_LIST="adaptive"
          export PR_DESCRIPTION__ADD_ORIGINAL_USER_DESCRIPTION="true"
          export PR_REVIEWER__EXTRA_INSTRUCTIONS=$'请用中文输出。\n优先指出 P0/P1 风险，避免纠结纯格式问题。\n重点检查安全、权限、状态一致性、异步/缓存、副作用和测试缺口。'
          export PR_REVIEWER__NUM_MAX_FINDINGS="5"
          export PR_REVIEWER__PERSISTENT_COMMENT="true"
          export PR_REVIEWER__PUBLISH_OUTPUT_NO_SUGGESTIONS="true"
          export PR_REVIEWER__REQUIRE_TESTS_REVIEW="true"
          export PR_REVIEWER__REQUIRE_SECURITY_REVIEW="true"
          export PR_REVIEWER__REQUIRE_ESTIMATE_EFFORT_TO_REVIEW="true"
          export PR_REVIEWER__REQUIRE_CAN_BE_SPLIT_REVIEW="true"
          export PR_REVIEWER__REQUIRE_TODO_SCAN="false"
          export PR_REVIEWER__ENABLE_REVIEW_LABELS_EFFORT="false"
          export PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY="true"
          export PR_CODE_SUGGESTIONS__FOCUS_ONLY_ON_PROBLEMS="true"
          export PR_CODE_SUGGESTIONS__SUGGESTIONS_SCORE_THRESHOLD="7"
          export PR_CODE_SUGGESTIONS__COMMITABLE_CODE_SUGGESTIONS="false"
          export PR_QUESTIONS__USE_CONVERSATION_HISTORY="true"

          if [ -z "$OPENAI__KEY" ]; then
            echo "Missing OPENAI_KEY or OPENAI_API_KEY secret." >&2
            exit 1
          fi
          if [ -z "$OPENAI__API_BASE" ]; then
            echo "Missing OPENAI_API_BASE or OPENAI_BASE_URL secret." >&2
            exit 1
          fi

          pr-agent --pr_url="$PR_URL" "$PR_AGENT_COMMAND"
